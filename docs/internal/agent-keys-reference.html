<!doctype html>
<html><head><meta charset="utf-8"><title>Agent keys</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--plate:#E9E3D6;--ink:#2A2722;--ink-3:#7d766a}
*{box-sizing:border-box;margin:0}
body{background:var(--plate);color:var(--ink);font-family:Geist,system-ui,sans-serif;padding:40px 48px 56px;width:1300px}
h1{font-size:22px;font-weight:600;letter-spacing:-.02em}
h2{font-size:13px;font-weight:500;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin:34px 0 18px}
p.sub{color:var(--ink-3);font-size:14px;margin-top:6px}
.row{display:flex;gap:34px;align-items:flex-start;flex-wrap:wrap}
.cell{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:112px}
.cell.sm{min-width:72px;gap:10px}
.lab{font-size:13px;font-weight:500}
.lab small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400;text-align:center}
.listrow{display:flex;align-items:center;gap:10px;background:#F3EFE6;border-radius:10px;padding:8px 14px 10px 10px;min-width:230px}
.listrow .n{font-size:13.5px;font-weight:500}.listrow .s{font-size:12px;color:var(--ink-3)}

/* ── the key ───────────────────────────── */
.k{--s:112px;--u:calc(var(--s) / 112);--d:calc(8 * var(--u));--ty:0px;
  position:relative;width:var(--s);height:var(--s);flex:none;
  margin-bottom:calc(8 * var(--u));
  border-radius:calc(16 * var(--u));background:var(--skirt);
  transform:translateY(var(--ty));
  box-shadow:0 var(--d) 0 var(--depth), 0 calc(var(--d) + 6 * var(--u)) calc(16 * var(--u)) calc(-4 * var(--u)) rgba(60,44,20,.30);
  transition:transform .12s cubic-bezier(.3,.7,.4,1),box-shadow .12s}
.k .face{position:absolute;left:calc(10 * var(--u));right:calc(10 * var(--u));top:calc(5 * var(--u));bottom:calc(17 * var(--u));
  border-radius:calc(11 * var(--u));background:var(--face);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
  display:grid;place-items:center;transition:filter .12s}
.k svg{width:calc(40 * var(--u));height:calc(40 * var(--u));fill:none;stroke:var(--legend);stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;overflow:visible;transition:stroke .2s,filter .2s}
.k .sub{position:absolute;right:calc(8 * var(--u));bottom:calc(5 * var(--u));font:600 calc(12 * var(--u))/1 "Geist Mono",monospace;color:var(--legend);opacity:.72}
.k .pips{position:absolute;left:0;right:0;bottom:calc(6 * var(--u));display:flex;justify-content:center;gap:calc(4 * var(--u))}
.k .pips i{width:calc(9 * var(--u));height:calc(4 * var(--u));border-radius:2px;background:var(--depth);box-shadow:inset 0 1px 0 rgba(0,0,0,.18)}
.k .pips i.on{background:var(--legend);box-shadow:none;opacity:.9}

/* small: 30px — face, skirt, 3px depth, no sublegend, no pips, heavier icon */
.k.small{--s:30px;--d:3px;margin-bottom:3px}
.k.small .face{left:3px;right:3px;top:1.5px;bottom:5px;border-radius:4px}
.k.small svg{width:15px;height:15px;stroke-width:2.6}
.k.small .sub,.k.small .pips{display:none}
.k.small{box-shadow:0 var(--d) 0 var(--depth),0 4px 6px -2px rgba(60,44,20,.28)}

/* states */
.k.working{--ty:calc(6 * var(--u));--d:calc(2 * var(--u))}
.k.small.working{--ty:2px;--d:1px}
.k .face::before{content:"";position:absolute;inset:0;border-radius:inherit;background:#000;opacity:0;transition:opacity .12s}
.k .face>svg{position:relative}
.k.working .face::before{opacity:.08}
.k.live .face::before,.k.ok .face::before{opacity:.2}
.k.live svg,.k.ok svg{stroke:#FFF6DC;filter:drop-shadow(0 0 1.5px #ffe2a0) drop-shadow(0 0 4px rgba(255,210,130,.75))}
.k.live .sub,.k.ok .sub{color:#FFF6DC;opacity:.95;text-shadow:0 0 3px rgba(255,210,130,.8)}
.k.ok{--ty:calc(-5 * var(--u));--d:calc(13 * var(--u))}
.k.small.ok{--ty:-2px;--d:5px}
.k.ok svg{animation:lit 1.6s ease-in-out infinite}
@keyframes lit{0%,100%{filter:drop-shadow(0 0 1.5px #ffe2a0) drop-shadow(0 0 4px rgba(255,210,130,.75));opacity:1}
  50%{filter:drop-shadow(0 0 .5px #ffe2a0) drop-shadow(0 0 1px rgba(255,210,130,.3));opacity:.78}}
@media (prefers-reduced-motion:reduce){.k.ok svg{animation:none}}

/* socket: cap removed */
.sock{--s:112px;--u:calc(var(--s) / 112);position:relative;width:var(--s);height:var(--s);flex:none;
  margin-top:calc(8 * var(--u));border-radius:calc(16 * var(--u));
  background:#D9D1C0;box-shadow:inset 0 calc(4 * var(--u)) calc(8 * var(--u)) rgba(70,55,30,.30),inset 0 0 0 1px rgba(70,55,30,.10);
  display:grid;place-items:center}
.sock.small{--s:30px;margin-top:3px}
.sock .housing{width:calc(48 * var(--u));height:calc(48 * var(--u));border-radius:calc(9 * var(--u));background:#CBC2AF;
  box-shadow:inset 0 calc(2 * var(--u)) calc(4 * var(--u)) rgba(70,55,30,.28);display:grid;place-items:center;position:relative}
.sock .stem{position:relative;width:calc(26 * var(--u));height:calc(26 * var(--u));filter:drop-shadow(0 calc(2 * var(--u)) 0 var(--depth,#9c937f))}
.sock .stem::before,.sock .stem::after{content:"";position:absolute;background:var(--stem,#B3AA96);border-radius:1px}
.sock .stem::before{left:0;right:0;top:calc(50% - 4 * var(--u));height:calc(8 * var(--u))}
.sock .stem::after{top:0;bottom:0;left:calc(50% - 4 * var(--u));width:calc(8 * var(--u))}
.sock.small .housing{width:16px;height:16px;border-radius:3.5px}
.sock.small .stem{width:10px;height:10px;filter:drop-shadow(0 1px 0 var(--depth,#9c937f))}
.sock.small .stem::before{top:3.5px;height:3px}.sock.small .stem::after{left:3.5px;width:3px}

/* colourways */
.blue{--face:#3F6FD8;--skirt:#3159B4;--depth:#223F85;--legend:#FFFFFF}
.orange{--face:#EC6A2E;--skirt:#C9521C;--depth:#8F3810;--legend:#1F1005}
.putty{--face:#E6DECC;--skirt:#CBC1AB;--depth:#A0967F;--legend:#2A2722}
.teal{--face:#6FC2B6;--skirt:#52A398;--depth:#33756C;--legend:#0C2421}
.graphite{--face:#4A4E55;--skirt:#34373C;--depth:#131417;--legend:#F2EEE4}
.mustard{--face:#E8B93F;--skirt:#C99A26;--depth:#8E6B12;--legend:#2A1E05}
.pink{--face:#EFA9A2;--skirt:#D48A83;--depth:#9C5C56;--legend:#2B0E0C}
.sage{--face:#A9BA78;--skirt:#8C9D5C;--depth:#5F6E38;--legend:#1A2108}
.sock.blue{--stem:#3F6FD8;--depth:#223F85}
.board{display:inline-flex;gap:18px;flex-wrap:wrap;padding:22px 24px 26px;border-radius:22px;background:linear-gradient(#E2DBCB,#DDD5C4);box-shadow:inset 0 2px 6px rgba(70,55,30,.18)}
</style></head><body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="inbox" viewBox="0 0 24 24"><path d="M12 3V11M8 7L12 11L16 7"/><path d="M3 13V21H21V13H16L14 15H10L8 13Z"/></symbol>
    <symbol id="code" viewBox="0 0 24 24"><path d="M9 6L3 12L9 18M15 6L21 12L15 18"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M14.5 14.5L20 20"/></symbol>
    <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7V12H16"/></symbol>
    <symbol id="pen" viewBox="0 0 24 24"><path d="M4 20V16L15 5L19 9L8 20Z"/></symbol>
    <symbol id="send" viewBox="0 0 24 24"><path d="M3 12H17M12 7L17 12L12 17M21 5V19"/></symbol>
    <symbol id="chat" viewBox="0 0 24 24"><path d="M4 5H20V16H11L7 20V16H4Z"/></symbol>
    <symbol id="grid" viewBox="0 0 24 24"><path d="M4 4H10V10H4ZM14 4H20V10H14ZM4 14H10V20H4ZM14 14H20V20H14Z"/></symbol>
  </defs>
</svg>

<h1>Agent keys</h1>
<p class="sub">One key (Blue · Inbox · bound to I · independence Steady, 2 of 4) in every state. Pure CSS shapes + one SVG legend.</p>

<h2>112px</h2>
<div class="row" id="big"></div>

<h2>30px (in a list)</h2>
<div class="row" id="small"></div>

<h2>30px in a sidebar row</h2>
<div class="row" id="rows"></div>

<h2>Independence pips (front edge, filled from the left)</h2>
<div class="row" id="pipsrow"></div>

<h2>Colourways</h2>
<div class="board" id="board"></div>
<div class="row" id="boardsm" style="margin-top:22px"></div>

<script>
const S=[['idle','Idle','at rest'],['working','Working','pressed'],['live','Live','legend lit'],['ok','Needs your OK','lit, pulsing, proud'],['paused','Paused','cap off'],['new','New agent','empty socket']];
const pips=n=>`<span class="pips">${[0,1,2,3].map(i=>`<i class="${i<n?'on':''}"></i>`).join('')}</span>`;
const key=(c,icon,state,small,sub='I',n=2)=>{
  if(state==='paused')return `<div class="sock ${c} ${small?'small':''}"><div class="housing"><div class="stem"></div></div></div>`;
  if(state==='new')return `<div class="sock ${small?'small':''}"><div class="housing"><div class="stem"></div></div></div>`;
  return `<div class="k ${c} ${state} ${small?'small':''}"><div class="face"><svg><use href="#${icon}"/></svg><span class="sub">${sub}</span></div>${pips(n)}</div>`};
const lab=(t,s)=>`<div class="lab">${t}${s?`<small>${s}</small>`:''}</div>`;
big.innerHTML=S.map(([s,t,d])=>`<div class="cell">${key('blue','inbox',s,false)}${lab(t,d)}</div>`).join('');
small.innerHTML=S.map(([s,t])=>`<div class="cell sm">${key('blue','inbox',s,true)}${lab(t)}</div>`).join('');
rows.innerHTML=[['idle','Inbox','Idle'],['working','Inbox','Working…'],['ok','Inbox','Needs your OK'],['paused','Inbox','Paused']].map(([s,n,l])=>`<div class="listrow">${key('blue','inbox',s,true)}<div><div class="n">${n}</div><div class="s">${l}</div></div></div>`).join('');
pipsrow.innerHTML=[[1,'Careful'],[2,'Steady'],[3,'Bold'],[4,'Unleashed']].map(([n,t])=>`<div class="cell">${key('blue','inbox','idle',false,'I',n)}${lab(t)}</div>`).join('');
const C=[['blue','inbox','I'],['orange','code','C'],['putty','search','S'],['teal','clock','R'],['graphite','pen','W'],['mustard','send','P'],['pink','chat','M'],['sage','grid','D']];
board.innerHTML=C.map(([c,i,k])=>key(c,i,'idle',false,k,2)).join('')+key('','','new',false);
boardsm.innerHTML=C.map(([c,i,k])=>key(c,i,'idle',true,k)).join('')+key('','','new',true);
</script>
</body></html>
