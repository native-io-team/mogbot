name: Build installers

# Windows and Linux installers. The Mac release is made by hand on the owner's
# Mac (scripts/release-mac.sh); these jobs only build and upload the installers
# as workflow artifacts. Attaching them to a release on the releases repo is a
# separate, deliberate step:
#   gh run download <run-id> -D dist
#   node scripts/latest-json-add-platforms.mjs <latest.json> dist v<version>
#   gh release upload v<version> dist/*/* <latest.json> --clobber -R <releases repo>
#
# Run it by hand (gh workflow run build-installers.yml --ref main) or by pushing
# a v* tag. Nothing here publishes anything.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The signing secrets (Tauri update key, Azure signing, the bug-report
  # secret) live only in the `release` environment, which needs the owner's
  # approval. This job refuses any other ref first, so a dispatch from a
  # feature branch fails here rather than waiting for that approval.
  check-ref:
    name: Only main or a v* tag
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse other refs
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main|refs/tags/v*) echo "Building from $REF" ;;
            *) echo "::error::Installers are signed only from main or a v* tag, not $REF"; exit 1 ;;
          esac

  build:
    name: ${{ matrix.name }}
    needs: check-ref
    environment: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            bundles: nsis,msi
            artifact: windows-x86_64
          - name: Linux x64
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
            artifact: linux-x86_64
          - name: Linux arm64
            os: ubuntu-22.04-arm
            bundles: deb,rpm,appimage
            artifact: linux-aarch64
    steps:
      - name: Force LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: bash scripts/ci-linux-deps.sh patchelf rpm file xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.9

      - name: Use bash for package scripts
        if: runner.os == 'Windows'
        run: npm config set script-shell "C:\Program Files\Git\bin\bash.exe"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'
          key: installers-${{ matrix.artifact }}

      - name: Name the MSVC assembler for CMake (whisper.cpp)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-msvc-asm.ps1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Windows code signing with Azure Trusted Signing. Off until the repo
      # has the secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
      # and the variables TRUSTED_SIGNING_ENDPOINT (e.g.
      # https://eus.codesigning.azure.net), TRUSTED_SIGNING_ACCOUNT and
      # TRUSTED_SIGNING_PROFILE. Tauri runs signCommand on the app exe and on
      # each installer; trusted-signing-cli reads the AZURE_* variables.
      - name: Set up Windows signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$ENDPOINT" ] || [ -z "$ACCOUNT" ] || [ -z "$PROFILE" ]; then
            echo "::warning::Windows signing not configured; the installers will be unsigned"
            exit 0
          fi
          cargo install trusted-signing-cli --locked
          NAME=$(node -p "require('./brand.json').name")
          node -e '
            const [e,a,p,n]=process.argv.slice(1);
            const cfg={bundle:{windows:{signCommand:`trusted-signing-cli -e ${e} -a ${a} -c ${p} -d ${n} %1`}}};
            require("fs").writeFileSync("tauri.signing.json", JSON.stringify(cfg));
          ' "$ENDPOINT" "$ACCOUNT" "$PROFILE" "$NAME"
          echo "TAURI_EXTRA_CONFIG=--config tauri.signing.json" >> "$GITHUB_ENV"

      # The update bundles (and their .sig) for Windows and Linux. Off until
      # the repo has the secret TAURI_SIGNING_PRIVATE_KEY (the same key as the
      # Mac's ~/.tauri/<slug>-updater.key) and its password.
      - name: Set up update bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::No updater key; no update bundles for this platform"
            exit 0
          fi
          echo '{"bundle":{"createUpdaterArtifacts":true}}' > tauri.updater.json
          echo "TAURI_UPDATER_CONFIG=--config tauri.updater.json" >> "$GITHUB_ENV"

      - name: Build installers
        shell: bash
        env:
          # AppImage's bundler shells out to linuxdeploy, which needs FUSE on
          # the runner; extract-and-run avoids it.
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Compiled in for automatic error reports; unset = the build sends none.
          BUG_REPORT_SECRET: ${{ secrets.BUG_REPORT_SECRET }}
        run: pnpm tauri build --bundles ${{ matrix.bundles }} ${TAURI_EXTRA_CONFIG:-} ${TAURI_UPDATER_CONFIG:-}

      - name: Stage installers
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./brand.json').name")
          B=src-tauri/target/release/bundle
          mkdir -p out
          shopt -s nullglob
          for f in $B/nsis/*-setup.exe; do cp "$f" "out/${NAME}_${VERSION}_${{ matrix.artifact }}-setup.exe"; done
          for f in $B/msi/*.msi; do cp "$f" "out/${NAME}_${VERSION}_${{ matrix.artifact }}.msi"; done
          for f in $B/deb/*.deb; do cp "$f" "out/${NAME}_${VERSION}_${{ matrix.artifact }}.deb"; done
          for f in $B/rpm/*.rpm; do cp "$f" "out/${NAME}_${VERSION}_${{ matrix.artifact }}.rpm"; done
          for f in $B/appimage/*.AppImage; do cp "$f" "out/${NAME}_${VERSION}_${{ matrix.artifact }}.AppImage"; done
          # Update bundles and their signatures, when the updater key was set.
          # Every installer type updates from its own kind (latest.json names
          # each one as <os>-<arch>-<bundle>), so each signature is kept.
          for f in $B/nsis/*-setup.exe.sig; do cp "$f" "out/${NAME}_${VERSION}_${{ matrix.artifact }}-setup.exe.sig"; done
          for f in $B/msi/*.msi.sig; do cp "$f" "out/${NAME}_${VERSION}_${{ matrix.artifact }}.msi.sig"; done
          for f in $B/deb/*.deb.sig; do cp "$f" "out/${NAME}_${VERSION}_${{ matrix.artifact }}.deb.sig"; done
          for f in $B/rpm/*.rpm.sig; do cp "$f" "out/${NAME}_${VERSION}_${{ matrix.artifact }}.rpm.sig"; done
          for f in $B/appimage/*.AppImage.sig; do cp "$f" "out/${NAME}_${VERSION}_${{ matrix.artifact }}.AppImage.sig"; done
          # Stable names too, so releases/latest/download/<name> always means
          # the newest one (like Mogbot.dmg on the Mac).
          for f in $B/nsis/*-setup.exe; do cp "$f" "out/${NAME}-${{ matrix.artifact }}-setup.exe"; done
          for f in $B/msi/*.msi; do cp "$f" "out/${NAME}-${{ matrix.artifact }}.msi"; done
          for f in $B/deb/*.deb; do cp "$f" "out/${NAME}-${{ matrix.artifact }}.deb"; done
          for f in $B/rpm/*.rpm; do cp "$f" "out/${NAME}-${{ matrix.artifact }}.rpm"; done
          for f in $B/appimage/*.AppImage; do cp "$f" "out/${NAME}-${{ matrix.artifact }}.AppImage"; done
          # Is the Windows installer signed? Printed so a run says so plainly.
          if [ "${{ runner.os }}" = "Windows" ]; then
            for f in out/*.exe; do powershell -NoProfile -Command "(Get-AuthenticodeSignature '$f').Status" || true; done
          fi
          ls -la out
          [ -n "$(ls out)" ] || { echo "::error::No installers were produced"; exit 1; }
          (cd out && for f in $(ls | grep -v '\.sig$'); do sha256sum "$f" > "$f.sha256"; done)

      # An update bundle signed with any other key than the one the app
      # carries is refused by every installed copy, silently: check each
      # one the way the updater will, with this version in its signature.
      - name: Check the update signatures
        if: env.TAURI_UPDATER_CONFIG != ''
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          shopt -s nullglob
          sigs=(out/*_${VERSION}_*.sig)
          [ ${#sigs[@]} -gt 0 ] || { echo "::error::The updater key is set but no update bundle was signed"; exit 1; }
          for s in "${sigs[@]}"; do
            node scripts/verify-updater-sig.mjs "${s%.sig}" "$s" --version "$VERSION"
          done

      - name: Upload installers
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: installers-${{ matrix.artifact }}
          path: out/
          if-no-files-found: error

  # Someone who has the last release installs this one over it: the new
  # installer must succeed, leave the new version installed, and the app must
  # start (Linux: under a virtual display for 15s). Nothing is published.
  install-over-last-release:
    name: Install over the last release (${{ matrix.name }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: windows-x86_64
          - name: Linux x64
            os: ubuntu-22.04
            artifact: linux-x86_64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers-${{ matrix.artifact }}
          path: new

      - name: Download the last release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # links.releases is the releases *page* (github.com/owner/repo/releases);
          # gh wants owner/repo, and reads a third part as a host.
          REPO=$(node -p "new URL(require('./brand.json').links.releases).pathname.split('/').filter(Boolean).slice(0, 2).join('/')")
          NAME=$(node -p "require('./brand.json').name")
          case "${{ matrix.artifact }}" in
            windows-*) PATTERN="${NAME}-${{ matrix.artifact }}-setup.exe" ;;
            *) PATTERN="${NAME}-${{ matrix.artifact }}.deb" ;;
          esac
          mkdir -p old
          # Without the last release there is nothing to install over, so this
          # check would pass having checked nothing: it fails instead.
          NEW_VERSION=$(node -p "require('./package.json').version")
          TAG=$(gh release view -R "$REPO" --json tagName --jq .tagName)
          # The same version over itself is no upgrade: apt would keep the old
          # package, and the version check after it would pass.
          if [ "${TAG#v}" = "$NEW_VERSION" ]; then
            echo "::error::The last release is already $NEW_VERSION, so there is no older one to install over: this was not checked"
            exit 1
          fi
          if ! gh release download "$TAG" -R "$REPO" -p "$PATTERN" -D old; then
            echo "::error::Could not download $PATTERN from $TAG of $REPO, so installing over it was not checked"
            exit 1
          fi
          ls -l old
          echo "OLD_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "APP_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Install the last release, then this one (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $old = Get-ChildItem old -Filter *-setup.exe | Select-Object -First 1
          if (-not $old) { throw 'the last release was not downloaded' }
          $p = Start-Process $old.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the last release's installer exited $($p.ExitCode)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\$($env:APP_NAME)" -Recurse -Filter *.exe |
            Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) { throw "the last release left no app under $env:LOCALAPPDATA\$($env:APP_NAME)" }
          $v = $exe.VersionInfo.ProductVersion
          Write-Host "installed first: $($exe.FullName) $v"
          if (-not $v.StartsWith($env:OLD_VERSION)) { throw "the last release installed as $v, expected $env:OLD_VERSION" }
          $new = Get-ChildItem new -Filter "$($env:APP_NAME)-*-setup.exe" | Select-Object -First 1
          $p = Start-Process $new.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the new installer exited $($p.ExitCode)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\$($env:APP_NAME)" -Recurse -Filter *.exe |
            Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) { throw "no installed app under $env:LOCALAPPDATA\$($env:APP_NAME)" }
          $v = $exe.VersionInfo.ProductVersion
          Write-Host "installed: $($exe.FullName) $v"
          if (-not $v.StartsWith($env:NEW_VERSION)) { throw "installed $v, expected $env:NEW_VERSION" }

      - name: Install the last release, then this one (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci-linux-deps.sh xvfb
          PKG=$(dpkg-deb -f "new/${APP_NAME}-${{ matrix.artifact }}.deb" Package)
          sudo apt-get install -y ./old/*.deb
          V=$(dpkg-query -W -f '${Version}' "$PKG")
          [ "$V" = "$OLD_VERSION" ] || { echo "::error::the last release installed as $V, expected $OLD_VERSION"; exit 1; }
          sudo apt-get install -y "./new/${APP_NAME}-${{ matrix.artifact }}.deb"
          V=$(dpkg-query -W -f '${Version}' "$PKG")
          echo "installed: $PKG $V"
          [ "$V" = "$NEW_VERSION" ] || { echo "::error::installed $V, expected $NEW_VERSION"; exit 1; }
          BIN=$(dpkg -L "$PKG" | grep -E '^/usr/bin/' | head -1)
          xvfb-run -a "$BIN" & PID=$!
          sleep 15
          kill -0 "$PID" || { echo "::error::$BIN exited within 15s"; exit 1; }
          kill "$PID" || true
