name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default token scope for every job: read-only on repo contents. If a
# malicious config-time payload ever does execute, the token it sees
# can't push, can't open PRs, can't comment, can't touch issues.
# Individual jobs can override per-step if they need more.
permissions:
  contents: read

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Config integrity — runs FIRST, fast, fails the whole CI before
  # anything else loads suspicious files. Catches the "obfuscated payload
  # hidden behind whitespace on a config-file line" attack class
  # (see incident 2026-04-29). Cheap, deterministic, no deps.
  config-integrity:
    name: Config Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Anomalous-line-length scan
        run: bash scripts/check-config-integrity.sh

  # Frontend checks (fast)
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: [config-integrity]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Brand identity matches brand.json
        run: pnpm check:brand

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint:strict

      - name: Format check
        run: pnpm format:check

      - name: Run tests
        run: pnpm test:run

      - name: Run tooling tests
        run: pnpm test:scripts

      - name: Icon inventory check
        run: pnpm icons:check

      - name: Design-system docs check
        run: pnpm docs:check

      - name: UI verification baseline
        run: pnpm check:ui-baseline

      - name: Coverage floor
        # Floor set at current baseline (~5% lines, 16% branches, 4% functions).
        # Plan's aspirational target is 25% lines / 20% branches; raise
        # thresholds as more tests land (see Block 14 follow-ups).
        run: pnpm test:coverage --coverage.thresholds.lines=4 --coverage.thresholds.functions=4 --coverage.thresholds.branches=15 --coverage.thresholds.statements=4

  # axe-core over every harness scenario, light and dark, with Reduce Motion
  # on. Fails on any WCAG A/AA violation (or a loop still running) beyond
  # scripts/a11y-baseline.json, so the known ones are worked down and no new
  # one lands. See docs/ui-harness.md, "Accessibility".
  a11y:
    name: Accessibility (axe over the harness)
    runs-on: ubuntu-latest
    needs: [config-integrity]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install

      - name: Start the harness
        run: |
          pnpm harness > /tmp/harness.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:1425/harness.html > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/harness.log
          exit 1

      - name: axe over every scenario
        run: pnpm check:a11y

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a11y-report
          path: harness/a11y/

  # Backend checks
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    needs: [config-integrity]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Linux dependencies
        timeout-minutes: 20
        run: bash scripts/ci-linux-deps.sh

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -A clippy::uninlined_format_args

      - name: Run tests
        # --lib --bins --tests: the examples are Mac-only dev drivers (the Keychain, Unix sockets).
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --bins --tests

      # The vendored PTY plugin is a path dependency, not a workspace member,
      # so the run above compiles it but never runs its tests. It owns the
      # assertion that `process_id` returns a real OS PID rather than a session
      # handler — the thing standing between us and the app SIGKILLing its own
      # process group again — and an untested guard is not a guard.
      - name: Run PTY plugin tests
        run: cargo test --manifest-path src-tauri/plugins/tauri-plugin-pty/Cargo.toml

  # Windows smoke test — the codebase has substantial Windows-specific logic
  # (PATH building, cmd.exe wrapping, .exe resolution in src-tauri/src/utils.rs
  # and the pty/setup/ide commands) that until now only compiled in CI on
  # Linux/macOS and was never actually RUN on Windows. This job exercises it:
  # the Rust tests cover the platform-cfg branches, and a no-bundle Tauri build
  # proves the app links against MSVC + WebView2. This is the gate before we
  # cut a -win release tag.
  windows-check:
    name: Windows Checks
    runs-on: windows-latest
    needs: [config-integrity]
    timeout-minutes: 40
    env:
      # `cargo test --lib --bins --tests` codegens the crate twice at once
      # (the lib for the bins, and the lib's tests). With full MSVC debuginfo
      # that ran the runner out of memory ("rustc-LLVM ERROR: out of memory",
      # run 43043767228) after type checking had passed. Panic messages keep
      # their file:line without debuginfo; only debugger symbols are lost.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      # Match the release-windows.yml pipeline: keep LF so bash scripts and
      # snapshot-style tests don't trip over CRLF on checkout.
      - name: Force LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.9

      # package.json scripts use bash constructs (check:patterns etc.); point
      # npm's script-shell at Git bash so they run the same as on Unix.
      - name: Use bash for package scripts
        run: npm config set script-shell "C:\Program Files\Git\bin\bash.exe"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install

      - name: Frontend tests
        run: pnpm test:run

      - name: Build frontend
        run: pnpm build

      # ConPTY spawn-shape canaries (direct vs. cmd.exe-wrapped PowerShell,
      # see pty_session.rs tests). Run first and with --nocapture so the
      # captured PTY output of BOTH variants is in the log as evidence even
      # when they pass — these tests exist to answer a quoting question, not
      # just to gate.
      - name: PTY spawn-shape canaries (verbose)
        # --lib --bins --tests: the examples are Mac-only dev drivers (Unix sockets, process groups).
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --bins --tests preserves_pipe_and_spaces_through_pty -- --nocapture

      - name: Backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --bins --tests

      - name: Check Tauri build (no bundle)
        run: pnpm tauri build --no-bundle

  # Build verification (PRs and main)
  build-check:
    name: Build Verification
    runs-on: macos-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Check Tauri build (no bundle)
        run: pnpm tauri build --no-bundle
