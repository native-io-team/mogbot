[package]
name = "mogbot"
version = "1.0.5"
description = "A desktop app for running your own team of AI agents."
authors = ["Julian Galluzzo", "Ship Studio contributors"]
license = "MIT"
repository = "https://github.com/native-io-team/mogbot"
homepage = "https://github.com/native-io-team/mogbot"
edition = "2021"

# Pattern enforcement lints — see also src-tauri/clippy.toml for disallowed-methods.
# unwrap/expect are WARN (not deny) because the existing codebase has many sites
# that would block CI immediately. Per-module migration raises these to deny as
# sites are paid down.
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "unstable", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-pty = { path = "plugins/tauri-plugin-pty" }
portable-pty = { version = "0.9.0", features = ["serde_support"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "process", "io-util", "net"] }
dirs = "5"
iana-time-zone = "0.1"
which = "6"
base64 = "0.22"
url = "2"
unicode-normalization = "0.1"
regex = "1"
tauri-plugin-screenshots = "2.2.0"
tauri-plugin-fs = "2"
# jpeg/gif/webp: custom thumbnail uploads decode whatever the user drags in
# (saved back out as PNG); png-only rejected every JPEG upload (issue #561).
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-deep-link = "2"
semver = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sentry-tracing = "0.49"
once_cell = "1.19"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zip = "9"
# Reading Hermes and OpenClaw .tar.gz exports (agents/import_formats.rs).
tar = "0.4"
flate2 = "1"
tauri-plugin-dialog = "2"
walkdir = "2"
ignore = "0.4"
dunce = "1"
urlencoding = "2"
hyper = { version = "1", features = ["http1", "server", "client"] }
# Android mirror bridge: WebSocket server streaming screenrecord H.264 to the webview.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
# The relay channel hands the companion socket handler a Sink (companion/relay/channel.rs).
tokio-util = "0.7"
hyper-util = { version = "0.1", features = ["tokio", "http1", "server", "client-legacy"] }
http-body-util = "0.1"
bytes = "1"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
# Native clipboard read for Windows terminal paste (WebView2 gates keyboard
# paste behind an async permission wait — see commands/clipboard.rs).
arboard = "3"
# Remote access renders an agent tab's screen as text for a phone to read
# (src/remote_access/screen.rs).
vt100 = "0.16"
# Remote access tokens: 256 bits straight from the OS CSPRNG.
getrandom = "0.2"
tempfile = "3"
tauri-plugin-notification = "2"
# Mobile companion (src/companion/): pairing codes in base32, the pairing QR
# code drawn by the Mac, and the backend seam the server is tested through.
data-encoding = "2"
qrcodegen = "1.8"
async-trait = "0.1"
# The companion's Mac identity: an Ed25519 key whose public half rides in the
# pairing QR code and signs every welcome, so the phone can pin it.
ring = "0.17"
# The phone relay's end-to-end channel (companion/relay/crypto.rs): X25519 with
# secrets the tests can fix (HKDF and ChaCha20-Poly1305 come from ring).
x25519-dalek = { version = "2", features = ["static_secrets"] }
# Agents' quick entry: a system-wide hotkey (default ⌥Space) that opens the
# floating composer over any app (src/agents/quick_entry.rs).
tauri-plugin-global-shortcut = "2"

[features]
# The agent browser (docs/design/agent-browser.md): the user's installed
# Chrome on a profile of the app's own, driven over a CDP pipe. Always in
# the build unless `no-agent-browser` is named: an opt-out, never a default
# feature, because `tauri dev` builds with `--no-default-features` and adds
# back only the defaults it read when it started, so a default feature
# added while it runs (or any build that drops defaults) silently left
# agents with no browser of their own. Without it the login cards fall
# back to Claude in Chrome.
default = []
no-agent-browser = []
# The demo's loopback stand-in for the phone (`agent_browser::viewer`): an
# input server, so it's never in the app, only in the example and tests.
browser-demo = []

[[example]]
name = "agent_browser_demo"
required-features = ["browser-demo"]

[dev-dependencies]

# Unix: signals for a process group (agents::procs stops a turn's whole tree).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: Job Objects, so a spawned command's whole process tree can be
# closed together (commands/pty/job.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

# macOS-specific dependencies for WebKit JavaScript evaluation
[target.'cfg(target_os = "macos")'.dependencies]
# Keychain items created by the app itself (SecItemAdd), so their access list
# names this app rather than /usr/bin/security (see the keychain module).
security-framework = "3"
core-foundation = "0.10"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSGeometry", "NSData"] }
block2 = "0.5"
